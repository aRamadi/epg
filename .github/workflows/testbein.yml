name: Test beIN Sports EPG

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Grab beIN Sports via Docker
        run: |
          mkdir -p docs
          docker run --rm \
            -v "${{ github.workspace }}/channels.xml:/epg/channels.xml:ro" \
            -v "${{ github.workspace }}/docs:/epg/docs" \
            --entrypoint sh \
            ghcr.io/iptv-org/epg:master \
            -lc 'npm run grab -- --channels=/epg/channels.xml --output=/epg/docs/guide.xml'

      - name: Show output
        run: |
          echo "=== guide.xml preview ==="
          head -50 docs/guide.xml || echo "guide.xml not found or empty"
